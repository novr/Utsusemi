# registration.mode picks Keychain layout and registrar (one per config).
# hosted_app: org target + broker. github_pat: org or repo (uncomment repo, clear org).
target:
  org: my-org
  runner_group_id: 1
  # repo: owner/repo
labels: [self-hosted, macOS, tart, arm64]
registration:
  mode: hosted_app
  # broker_url: https://utsusemi.duckdns.org
provider: tart
base_image: ghcr.io/cirruslabs/macos-sequoia-base:latest
# Concrete pin only (not "latest"). New setups: configure app/token defaults to resolving latest.
runner_version: "2.336.0"
pool_size: 1
# reclaim_policy: grace
# reclaim_grace: 15m
# softnet: true    # brew install cirruslabs/cli/softnet + root
# mounts:
#   - ~/utsusemi-cache/swiftpm
# Literal guest env (host job steps inherit process env; not workflow env context; no $VAR expansion).
# Keys: [A-Za-z_][A-Za-z0-9_]*. Do not put secrets here. RUNNER_* reserved.
# env:
#   http_proxy: http://proxy.example:8080
#   https_proxy: http://proxy.example:8080
#   no_proxy: localhost,127.0.0.1
# macOS system proxy for URLSession / CFNetwork. Does not set http_proxy (curl still uses env).
# host:port only. Quote IPv6 ("[2001:db8::1]:443") and bypass entries that contain * or <. Omitting bypass keeps the image exclusions.
# Guest needs passwordless sudo. Restart the agent to apply. softnet cannot reach the host.
# system_proxy:
#   http: proxy.example:8080
#   https: proxy.example:8080
#   bypass:
#     - localhost
#     - 127.0.0.1
#     - "<local>"
#     - "*.local"
