# registration.mode picks Keychain layout and registrar (one per config).
# hosted_app: org target + broker. github_pat: org or repo (uncomment repo, clear org).
target:
  org: my-org
  runner_group_id: 1
  # repo: owner/repo
labels: [self-hosted, macOS, tart, arm64]
registration:
  mode: hosted_app
  # broker_url: https://utsusemi.duckdns.org
provider: tart
base_image: ghcr.io/cirruslabs/macos-sequoia-base:latest
runner_version: "2.336.0"
pool_size: 1
# reclaim_policy: grace
# reclaim_grace: 15m
# softnet: true    # brew install cirruslabs/cli/softnet + root
# mounts:
#   - ~/utsusemi-cache/swiftpm
# Literal env for bootstrap + run.sh only (not job steps; no $VAR expansion).
# Keys: [A-Za-z_][A-Za-z0-9_]*. Do not put secrets here. RUNNER_* reserved.
# env:
#   HTTP_PROXY: http://proxy.example:8080
#   HTTPS_PROXY: http://proxy.example:8080
#   NO_PROXY: localhost,127.0.0.1
