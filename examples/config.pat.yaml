target:
  repo: owner/repo
labels: [self-hosted, macOS, tart, arm64]
registration:
  mode: github_pat
provider: tart
base_image: ghcr.io/cirruslabs/macos-sequoia-base:latest
runner_version: "2.336.0"
pool_size: 1
# softnet defaults to false (macOS NAT); set true and see Softnet docs
# https://github.com/cirruslabs/softnet
# softnet: true
# mounts: host directories shared into VMs via tart --dir (see README)
# mounts:
#   - ~/utsusemi-cache/swiftpm
#   - ~/utsusemi-toolchains:ro
# env: literal guest env; host job steps inherit process env (see README)
# env:
#   http_proxy: http://proxy.example:8080
# macOS system proxy for URLSession / CFNetwork. Does not set http_proxy (curl still uses env).
# host:port only. Quote IPv6 ("[2001:db8::1]:443") and bypass entries that contain * or <. Omitting bypass keeps the image exclusions.
# Guest needs passwordless sudo. Restart the agent to apply. softnet cannot reach the host.
# system_proxy:
#   http: 192.168.64.1:8888
#   https: 192.168.64.1:8888
#   bypass:
#     - localhost
#     - 127.0.0.1
#     - "<local>"
#     - "*.local"

