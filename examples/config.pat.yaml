target:
  repo: owner/repo
labels: [self-hosted, macOS, tart, arm64]
registration:
  mode: github_pat
provider: tart
base_image: ghcr.io/cirruslabs/macos-sequoia-base:latest
runner_version: "2.336.0"
pool_size: 1
# softnet defaults to false (macOS NAT); set true and see Softnet docs
# https://github.com/cirruslabs/softnet
# softnet: true
# mounts: host directories shared into VMs via tart --dir (see README)
# mounts:
#   - ~/utsusemi-cache/swiftpm
#   - ~/utsusemi-toolchains:ro
