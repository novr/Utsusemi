# Manual Tart / GitHub E2E for opt-in action_cache. Not a CI gate.
# Requires a warm utsusemi agent with action_cache: true and label utsusemi-e2e.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

env:
  LOCAL_CACHE_DIR: /Volumes/My Shared Files/utsusemi-action-cache

jobs:
  # Fresh VM: cache miss, then post-job save into the host action-cache store.
  prime:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - utsusemi-e2e
    steps:
      - name: Require UTSUSEMI_ACTION_CACHE in process env
        run: |
          set -euo pipefail
          # Host job steps inherit bootstrap env; workflow env context does not.
          test "${UTSUSEMI_ACTION_CACHE:-}" = "1"
          if [ -n "${UTSUSEMI_ACTION_CACHE_BIN_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_DATA_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_ADDR:-}" ]; then
            echo "control action-cache env leaked into job" >&2
            env | grep '^UTSUSEMI_ACTION_CACHE' >&2 || true
            exit 1
          fi

      - name: Write payload
        run: |
          set -euo pipefail
          mkdir -p .utsusemi-e2e-cache
          printf '%s\n' "${{ github.run_id }}-${{ github.run_attempt }}" > .utsusemi-e2e-cache/marker

      - name: Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .utsusemi-e2e-cache
          key: utsusemi-action-cache-e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Expect miss
        run: |
          set -euo pipefail
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "unexpected cache-hit on prime" >&2
            exit 1
          fi

  # Second spawn: restore from host store across VM recycle.
  hit:
    needs: prime
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - utsusemi-e2e
    steps:
      - name: Require UTSUSEMI_ACTION_CACHE in process env
        run: |
          set -euo pipefail
          test "${UTSUSEMI_ACTION_CACHE:-}" = "1"
          if [ -n "${UTSUSEMI_ACTION_CACHE_BIN_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_DATA_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_ADDR:-}" ]; then
            echo "control action-cache env leaked into job" >&2
            env | grep '^UTSUSEMI_ACTION_CACHE' >&2 || true
            exit 1
          fi

      - name: Require local host store (not GitHub cloud)
        run: |
          set -euo pipefail
          # Prime's post-job save must have written THIS run's key on the shared mount.
          # A leftover final from an older run must not pass.
          key="utsusemi-action-cache-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
          found=0
          for meta in "${LOCAL_CACHE_DIR}"/*/meta.json; do
            [ -f "$meta" ] || continue
            [ -f "${meta%/*}/final" ] || continue
            if grep -Fq "\"key\":\"${key}\"" "$meta"; then
              found=1
              break
            fi
          done
          if [ "$found" != 1 ]; then
            echo "no local final for key=${key} under ${LOCAL_CACHE_DIR}" >&2
            ls -la "${LOCAL_CACHE_DIR}" >&2 || true
            exit 1
          fi

      - name: Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .utsusemi-e2e-cache
          key: utsusemi-action-cache-e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Expect hit
        run: |
          set -euo pipefail
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test -f .utsusemi-e2e-cache/marker
          grep -qx "${{ github.run_id }}-${{ github.run_attempt }}" .utsusemi-e2e-cache/marker

  # setup-* cache: path uses the same CacheService v2 redirect.
  # Unique package name per run so a prior GitHub cloud entry cannot false-hit.
  setup_node_prime:
    needs: hit
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - utsusemi-e2e
    outputs:
      finals_before: ${{ steps.count_finals.outputs.n }}
    steps:
      - name: Require UTSUSEMI_ACTION_CACHE in process env
        run: |
          set -euo pipefail
          test "${UTSUSEMI_ACTION_CACHE:-}" = "1"
          if [ -n "${UTSUSEMI_ACTION_CACHE_BIN_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_DATA_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_ADDR:-}" ]; then
            echo "control action-cache env leaked into job" >&2
            env | grep '^UTSUSEMI_ACTION_CACHE' >&2 || true
            exit 1
          fi

      - name: Count local finals before npm save
        id: count_finals
        run: |
          set -euo pipefail
          n=0
          for meta in "${LOCAL_CACHE_DIR}"/*/meta.json; do
            [ -f "$meta" ] || continue
            [ -f "${meta%/*}/final" ] || continue
            n=$((n + 1))
          done
          echo "n=${n}" >> "$GITHUB_OUTPUT"

      - name: Tiny npm project
        run: |
          set -euo pipefail
          name="utsusemi-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
          printf '%s\n' "{\"name\":\"${name}\",\"version\":\"0.0.0\",\"private\":true}" > package.json
          printf '%s\n' "{\"name\":\"${name}\",\"lockfileVersion\":3,\"requires\":true,\"packages\":{\"\":{\"name\":\"${name}\",\"version\":\"0.0.0\",\"private\":true}}}" > package-lock.json

      - id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Expect npm miss
        run: |
          set -euo pipefail
          if [ "${{ steps.node.outputs.cache-hit }}" = "true" ]; then
            echo "unexpected npm cache-hit on setup_node_prime" >&2
            exit 1
          fi

  setup_node_hit:
    needs: setup_node_prime
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - utsusemi-e2e
    steps:
      - name: Require UTSUSEMI_ACTION_CACHE in process env
        run: |
          set -euo pipefail
          test "${UTSUSEMI_ACTION_CACHE:-}" = "1"
          if [ -n "${UTSUSEMI_ACTION_CACHE_BIN_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_DATA_DIR:-}" ] || [ -n "${UTSUSEMI_ACTION_CACHE_ADDR:-}" ]; then
            echo "control action-cache env leaked into job" >&2
            env | grep '^UTSUSEMI_ACTION_CACHE' >&2 || true
            exit 1
          fi

      - name: Require local host store grew after npm prime
        run: |
          set -euo pipefail
          before="${{ needs.setup_node_prime.outputs.finals_before }}"
          n=0
          for meta in "${LOCAL_CACHE_DIR}"/*/meta.json; do
            [ -f "$meta" ] || continue
            [ -f "${meta%/*}/final" ] || continue
            n=$((n + 1))
          done
          if [ "$n" -le "$before" ]; then
            echo "no new local final after setup_node_prime (before=${before} after=${n})" >&2
            ls -la "${LOCAL_CACHE_DIR}" >&2 || true
            exit 1
          fi

      - name: Tiny npm project
        run: |
          set -euo pipefail
          name="utsusemi-e2e-${{ github.run_id }}-${{ github.run_attempt }}"
          printf '%s\n' "{\"name\":\"${name}\",\"version\":\"0.0.0\",\"private\":true}" > package.json
          printf '%s\n' "{\"name\":\"${name}\",\"lockfileVersion\":3,\"requires\":true,\"packages\":{\"\":{\"name\":\"${name}\",\"version\":\"0.0.0\",\"private\":true}}}" > package-lock.json

      - id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Expect npm cache hit
        run: |
          set -euo pipefail
          test "${{ steps.node.outputs.cache-hit }}" = "true"
