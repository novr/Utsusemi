name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.23"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/utsusemi ./cmd/utsusemi
      - name: Verify version embedding
        run: |
          go build -ldflags "-X github.com/novr/utsusemi/internal/version.Version=1.2.3-test" -o /tmp/utsusemi-version ./cmd/utsusemi
          test "$(/tmp/utsusemi-version --version)" = "utsusemi version 1.2.3-test"
          test "$(/tmp/utsusemi-version version)" = "utsusemi version 1.2.3-test"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run typecheck
