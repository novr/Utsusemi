# Agent that serves `.github/workflows/e2e.yaml`.
# Isolated from a daily agent: own state_dir, vm_name_prefix, Keychain service.
# Labels omit bare `utsusemi` so this runner does not take non-e2e jobs.
# Secrets stay in Keychain — never in this file.
# Run from the repository root (state_dir is relative to the process cwd).
#
#   utsusemi configure token --config e2e/config.yaml --repo novr/Utsusemi
#   utsusemi run --config e2e/config.yaml --log
#   gh workflow run e2e.yaml --repo novr/Utsusemi
target:
  repo: novr/Utsusemi
labels:
  - self-hosted
  - macOS
  - ARM64
  - utsusemi-e2e
registration:
  mode: github_pat
  credential_keychain_service: utsusemi-credential-e2e
provider: tart
base_image: ghcr.io/cirruslabs/macos-tahoe-xcode:27
runner_version: "2.338.2"
pool_size: 1
vm_name_prefix: utsusemi-e2e-
state_dir: e2e/.state
action_cache: true
